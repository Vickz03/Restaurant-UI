<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2B77A" />
      <stop offset="50%" stop-color="#B89B62" />
      <stop offset="100%" stop-color="#997C44" />
    </linearGradient>
  </defs>
  
  <!-- Obsidian Circle Background -->
  <circle cx="256" cy="256" r="240" fill="#0B0B0A" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Outer Gold Accent Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Monogram A / Cloche Fine Dining Icon -->
  <g transform="translate(256, 256)">
    <!-- Cloche Cover Line -->
    <path d="M -90,40 Q 0,-60 90,40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Handle Knob -->
    <circle cx="0" cy="-68" r="14" fill="url(#goldGrad)" />
    <!-- Base Plate -->
    <line x1="-110" y1="56" x2="110" y2="56" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Monogram A Accent in center -->
    <text x="0" y="32" font-family="'Cormorant Garamond', serif" font-size="75" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">A</text>
  </g>
</svg>
